name: markdown_check

on:
  pull_request:
    paths:
      - "**.md"
      - "**.markdown"

jobs:
  markdownCheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prettify md
        uses: creyD/prettier_action@v4.6
        with:
          prettier_options: --check **/*.md
