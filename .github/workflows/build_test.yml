name: build_test

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  buildTest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build Jekyll site
        uses: actions/jekyll-build-pages@v1
